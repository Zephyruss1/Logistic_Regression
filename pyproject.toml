[project]
name = "logistic-regression"
version = "0.1.0"
description = ""
authors = [
  { name = "Zephyrus", email = "zephyrus1175@yahoo.com" }
]
requires-python = ">=3.10,<4.0"
dependencies = [
  "numpy>=2.1.0,<3.0.0",
  "cvxpy>=1.5.3,<2.0.0",
  "ecos>=2.0.0,<3.0.0",
  "cvxopt>=1.3.0,<2.0.0",
  "matplotlib>=3.9.2,<4.0.0",
  "scipy>=1.14.1,<2.0.0",
  "torch>=2.5.0,<3.0.0",
  "xgboost>=2.1.2,<3.0.0",
  "optuna>=4.1.0,<5.0.0",
  "fastapi>=0.115.6,<0.116.0",
  "uvicorn>=0.34.0,<0.35.0",
  "streamlit>=1.41.1,<2.0.0",
  "plotly-express>=0.4.1,<0.5.0",
  "scikit-learn>=1.6.0,<2.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.3,<9.0.0",
  "ipykernel>=6.29.5,<7.0.0",
  "jupyter>=1.1.1,<2.0.0",
  "ruff>=0.7.2,<0.8.0",
  "pandas>=2.2.3,<3.0.0",
  "pre-commit>=4.6.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.hatch.build.targets.wheel]
packages = ["src/logistic_regression"]

[tool.ruff.format]
indent-style = "space"
indent-width = 2